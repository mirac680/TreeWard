name: TreeWard preflight
description: Scan a Git working tree for common publish-time hazards.

inputs:
  path:
    description: Repository directory to scan.
    required: false
    default: .
  fail-on:
    description: Minimum severity that makes the action fail (high, medium, low, or never).
    required: false
    default: ""
  max-file-size-mb:
    description: Skip larger files; accepts a value greater than 0 and no more than 100 MiB.
    required: false
    default: ""
  report-path:
    description: SARIF report path, relative to the workspace or absolute.
    required: false
    default: treeward.sarif

outputs:
  report:
    description: Path of the generated SARIF report.
    value: ${{ inputs.report-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install TreeWard
      id: install
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan repository
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TREEWARD_PATH: ${{ inputs.path }}
        TREEWARD_FAIL_ON: ${{ inputs.fail-on }}
        TREEWARD_MAX_FILE_SIZE_MB: ${{ inputs.max-file-size-mb }}
      run: |
        set -- --format text
        if [[ -n "$TREEWARD_FAIL_ON" ]]; then
          set -- "$@" --fail-on "$TREEWARD_FAIL_ON"
        fi
        if [[ -n "$TREEWARD_MAX_FILE_SIZE_MB" ]]; then
          set -- "$@" --max-file-size-mb "$TREEWARD_MAX_FILE_SIZE_MB"
        fi
        treeward "$@" -- "$TREEWARD_PATH"
    - name: Write SARIF report
      if: always() && steps.install.outcome == 'success'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TREEWARD_PATH: ${{ inputs.path }}
        TREEWARD_MAX_FILE_SIZE_MB: ${{ inputs.max-file-size-mb }}
        TREEWARD_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -- --format sarif --fail-on never --output "$TREEWARD_REPORT_PATH"
        if [[ -n "$TREEWARD_MAX_FILE_SIZE_MB" ]]; then
          set -- "$@" --max-file-size-mb "$TREEWARD_MAX_FILE_SIZE_MB"
        fi
        treeward "$@" -- "$TREEWARD_PATH"
